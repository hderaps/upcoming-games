name: Sync Ice Zoo game schedule

on:
  schedule:
    # 15:00 UTC = 1am Sydney (AEST). Drifts to 2am during daylight saving
    # (AEDT) since GitHub Actions cron is fixed UTC — harmless for this.
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  push-ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/push-ics.mjs
        env:
          GC_PUSH_SECRET: ${{ secrets.GC_PUSH_SECRET }}
